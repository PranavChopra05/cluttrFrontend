<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brain.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cluttr — your second brain. Save links, videos, threads, repos and docs in one beautiful place, then find anything with AI." />
    <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:title" content="Cluttr — Your Second Brain" />
    <meta property="og:description" content="Save anything. Find everything. An AI-powered home for the links worth keeping." />
    <meta property="og:type" content="website" />

    <title>Cluttr — Your Second Brain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Prevent theme flash: apply stored/system theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cluttr-theme") || "dark";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
